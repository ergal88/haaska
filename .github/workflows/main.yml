name: Main

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install -r requirements-test.txt
    - name: Test
      run: python -m pytest test.py
    - name: Build ZIP with sample configuration
      if: matrix.python-version == '3.14'
      run: |
        cp config/config.json.sample config/config.json
        make
    - name: Test ZIP in Lambda Python 3.14 (local only)
      if: matrix.python-version == '3.14'
      run: |
        docker run --rm --network none --entrypoint /bin/sh \
          -v "$PWD:/src:ro" public.ecr.aws/lambda/python:3.14 -c \
          'python -m zipfile -e /src/haaska.zip /tmp/package && cd /tmp/package && PYTHONPATH=/tmp/package python /src/tests/smoke_lambda.py'
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |
        python -m pip install -r requirements-test.txt
    - name: Lint
      run: python -m flake8 haaska.py test.py tests/smoke_lambda.py
